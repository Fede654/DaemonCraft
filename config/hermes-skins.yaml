# Hermes Skin Assignment Map
# Maps agent names (as declared in cast YAMLs) to skin sources.
#
# Supported source types:
#   mojang:<username>   — Fetch skin texture from Mojang by premium username.
#   url:<image-url>     — Upload a skin image URL via MineSkin (requires internet).
#   local:<.playerskin> — Copy an existing SkinsRestorer .playerskin file.
#   default             — Use SkinsRestorer default skin handling (no override).
#
# The script writes <offline-uuid>.playerskin into:
#   server/data/plugins/SkinsRestorer/skins/
#
# Run:
#   python scripts/assign-skins.py
#   python scripts/assign-skins.py --dry-run
#   python scripts/assign-skins.py --skin-config config/hermes-skins.yaml

